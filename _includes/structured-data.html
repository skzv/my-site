{% assign lang_code = page.lang_code | default: 'en' %}
{% assign locale = site.data.locales | where: "code", lang_code | first %}
{% assign t = site.data.i18n[lang_code] %}
{% assign page_url = site.url | append: locale.prefix %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": {{ site.url | append: '/' | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ t.description | jsonify }},
      "inLanguage": {{ locale.tag | jsonify }},
      "author": { "@id": "{{ site.url }}/#person" },
      "about": { "@id": "{{ site.url }}/#person" }
    },
    {
      "@type": "ProfilePage",
      "@id": "{{ page_url }}#profilepage",
      "url": {{ page_url | jsonify }},
      "name": {{ t.page_title | jsonify }},
      "description": {{ t.description | jsonify }},
      "inLanguage": {{ locale.tag | jsonify }},
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "mainEntity": { "@id": "{{ site.url }}/#person" },
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "url": {{ site.url | append: page.image.path | jsonify }},
        "width": {{ page.image.width }},
        "height": {{ page.image.height }}
      }
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": {{ site.author.name | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "mainEntityOfPage": { "@id": "{{ page_url }}#profilepage" },
      "description": {{ t.description | jsonify }},
      "jobTitle": {{ t.job_title | jsonify }},
      "worksFor": { "@type": "Organization", "name": "Google" },
      "knowsAbout": {{ t.knows_about | jsonify }},
      "sameAs": [
        "{% if lang_code == 'en' %}{{ t.blog_base }}{% else %}{{ t.blog_base }}/{% endif %}",
        "https://directory.skz.dev",
        "https://www.linkedin.com/in/skzv",
        "https://github.com/skzv",
        "https://twitter.com/_skzv",
        "https://instagram.com/_skzv7"
      ]
    }
  ]
}
</script>
